<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraFlow — Offline Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0F2F24, #183B2F, #265947);
            color: #F4F7F5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            padding: 20px;
        }

        .offline-card {
            background: #FFFFFF;
            color: #0F172A;
            border-radius: 16px;
            max-width: 460px;
            width: 100%;
            padding: 40px 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            border: 1px solid #E1EBE4;
        }

        .offline-icon-circle {
            width: 80px;
            height: 80px;
            background: #EBF3EF;
            color: #0F2F24;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            border: 2px solid #E1EBE4;
        }

        .btn-retry {
            background: linear-gradient(135deg, #0F2F24, #1B4D3E);
            color: #FFFFFF;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-retry:hover {
            background: linear-gradient(135deg, #1B4D3E, #10B981);
            color: #FFFFFF;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-circle">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h3 class="fw-bold mb-2" style="color: #0F2F24;">You are Offline</h3>
        <p class="text-muted mb-4 small">
            FloraFlow could not reach the server. Please check your nursery Wi-Fi or mobile data connection to sync live sales and inventory.
        </p>

        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <button onclick="window.location.reload()" class="btn btn-retry shadow-sm">
                <i class="bi bi-arrow-clockwise me-1"></i>Retry Connection
            </button>
            <a href="/dashboard" class="btn btn-outline-secondary">
                <i class="bi bi-house me-1"></i>Home
            </a>
        </div>

        <div class="mt-4 pt-3 border-top text-muted small">
            <span class="badge bg-light text-success border">FloraFlow PWA</span> &bull; Offline Mode Protection
        </div>
    </div>
</body>
</html>
