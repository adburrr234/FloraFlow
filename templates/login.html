<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraFlow — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1b4332, #40916c, #95d5b2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loginCard {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .logoText {
            font-size: 2rem;
            font-weight: 700;
            color: #1b4332;
        }

        .logoLeaf {
            color: #40916c;
        }

        .btn-flora {
            background: linear-gradient(135deg, #1b4332, #40916c);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-flora:hover {
            background: linear-gradient(135deg, #40916c, #1b4332);
            color: white;
        }

        .form-control:focus {
            border-color: #40916c;
            box-shadow: 0 0 0 0.2rem rgba(64, 145, 108, 0.25);
        }
    </style>
</head>

<body>
    <div class="loginCard">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="FloraFlow Logo" style="width: 76px; height: 76px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 16px rgba(27,67,50,0.25); border: 2px solid #e8f5e9;" class="mb-3">
            <div class="logoText">Flora<span class="logoLeaf">Flow</span></div>
            <p class="text-muted mt-1 small">Nursery Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-flora d-flex align-items-center justify-content-center" id="loginBtn">
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="btnText">Login</span>
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="/privacyPolicy" class="text-muted text-decoration-none small">
                <i class="bi bi-shield-check me-1"></i>Privacy Policy
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            var btn = document.getElementById('loginBtn');
            var btnSpinner = document.getElementById('btnSpinner');
            var btnText = document.getElementById('btnText');

            // Show working spinning loading indicator immediately
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Logging in...';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.85';
        });
    </script>
</body>

</html>
