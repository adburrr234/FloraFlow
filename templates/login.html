<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraFlow — Login</title>
    <!-- PWA Web App Manifest & Mobile Shell Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0F2F24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FloraFlow">
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="shortcut icon" type="image/png" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0F2F24 0%, #163B2E 50%, #1B4D3E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .loginCard {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 16px 48px rgba(15, 47, 36, 0.22);
            border: 1px solid #E1EBE4;
        }

        .logoText {
            font-size: 2rem;
            font-weight: 700;
            color: #0F2F24;
            letter-spacing: -0.5px;
        }

        .logoLeaf {
            color: #10B981;
        }

        .btn-flora {
            background: linear-gradient(135deg, #0F2F24, #1B4D3E);
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-flora:hover {
            background: linear-gradient(135deg, #1B4D3E, #10B981);
            color: white;
            box-shadow: 0 4px 14px rgba(15, 47, 36, 0.25);
        }

        .form-control:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div class="loginCard">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="FloraFlow Logo" style="width: 76px; height: 76px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 16px rgba(27,67,50,0.25); border: 2px solid #e8f5e9;" class="mb-3">
            <div class="logoText">Flora<span class="logoLeaf">Flow</span></div>
            <p class="text-muted mt-1 small">Nursery Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-flora d-flex align-items-center justify-content-center" id="loginBtn">
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="btnText">Login</span>
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="/privacyPolicy" class="text-muted text-decoration-none small">
                <i class="bi bi-shield-check me-1"></i>Privacy Policy
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            var btn = document.getElementById('loginBtn');
            var btnSpinner = document.getElementById('btnSpinner');
            var btnText = document.getElementById('btnText');

            // Show working spinning loading indicator immediately
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Logging in...';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.85';
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then((reg) => {
                        console.log('[PWA] Service Worker registered on login with scope:', reg.scope);
                    })
                    .catch((err) => {
                        console.warn('[PWA] Service Worker registration failed on login:', err);
                    });
            });
        }
    </script>
</body>

</html>
